<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VoiceFactory Gateway</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/dev/styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="topbar" aria-label="Runtime status">
        <div>
          <p class="eyebrow">Gateway Core</p>
          <h1>VoiceFactory</h1>
        </div>
        <div class="top-actions">
          <button class="ghost icon-button" id="themeToggle" type="button" aria-label="Toggle dark mode">Dark</button>
          <div class="status" id="healthStatus">
            <span class="dot"></span>
            <span>Checking</span>
          </div>
        </div>
      </section>

      <nav class="tabs" aria-label="Workspace tabs">
        <button class="tab active" type="button" data-tab="queue">Queue</button>
        <button class="tab" type="button" data-tab="assets">Assets</button>
        <button class="tab" type="button" data-tab="edit">Edit</button>
      </nav>

      <section class="runtime-grid" aria-label="Runtime cards">
        <article class="metric">
          <span>Gateway</span>
          <strong id="gatewayValue">-</strong>
        </article>
        <article class="metric">
          <span>Database</span>
          <strong id="dbValue">-</strong>
        </article>
        <article class="metric">
          <span>Browser CDP</span>
          <strong id="browserValue">-</strong>
        </article>
        <article class="metric">
          <span>Worker</span>
          <strong id="workerValue">-</strong>
        </article>
        <article class="metric">
          <span>Desktop</span>
          <strong id="desktopValue">Browser</strong>
        </article>
      </section>

      <section class="workbench tab-panel active" id="tab-queue">
        <section class="panel" aria-label="Gateway connection">
          <div class="panel-head">
            <h2>Connection</h2>
          </div>
          <form class="composer" id="connectionForm">
            <div class="field field-full">
              <label for="gatewayBaseUrl">Gateway URL</label>
              <input id="gatewayBaseUrl" name="gatewayBaseUrl" placeholder="http://100.x.y.z:3000 (empty = same-origin)">
            </div>
            <div class="field field-full">
              <label for="gatewayToken">Token</label>
              <input id="gatewayToken" name="gatewayToken" type="password" placeholder="empty if auth is off">
            </div>
            <button class="primary" type="submit">Save</button>
            <p class="message" id="connectionMessage" role="status"></p>
          </form>
        </section>

        <form class="composer" id="queueForm">
          <div class="field field-full">
            <label for="content">Text</label>
            <textarea id="content" name="content" rows="7">Xin chao, day la job fake dau tien.</textarea>
          </div>

          <div class="field">
            <label for="voiceCode">Voice</label>
            <input id="voiceCode" name="voiceCode" value="fake_voice">
          </div>

          <div class="field">
            <label for="speed">Speed</label>
            <input id="speed" name="speed" type="number" min="0.5" max="2" step="0.05" value="1.05">
          </div>

          <label class="check">
            <input id="incognito" name="incognito" type="checkbox" checked>
            <span class="check-label">
              <svg class="check-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2 8h3a3 3 0 0 1 3 3v1a3 3 0 0 1-3 3H4a2 2 0 0 1-2-2V8z"></path>
                <path d="M22 8h-3a3 3 0 0 0-3 3v1a3 3 0 0 0 3 3h1a2 2 0 0 0 2-2V8z"></path>
                <path d="M8 11h8"></path>
                <path d="M2 8l3-3h2"></path>
                <path d="M22 8l-3-3h-2"></path>
              </svg>
              Incognito Mode
            </span>
          </label>

          <button class="primary" type="submit">Add Queue</button>
          <p class="message" id="formMessage" role="status"></p>
        </form>

        <section class="panel full-width" aria-label="Queue">
          <div class="panel-head">
            <h2>Queue</h2>
            <div class="panel-actions">
              <button class="ghost" id="exportQueueCsv" type="button">Export CSV</button>
              <button class="ghost" id="refreshQueue" type="button">Refresh</button>
            </div>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Status</th>
                  <th>Text</th>
                  <th>Voice</th>
                  <th>Created</th>
                </tr>
              </thead>
              <tbody id="queueRows"></tbody>
            </table>
          </div>
        </section>

      </section>

      <section class="asset-workspace tab-panel" id="tab-assets" aria-label="Assets">
        <section class="panel">
          <div class="panel-head">
            <h2>Assets</h2>
            <div class="panel-actions">
              <button class="ghost" id="exportAssetsCsv" type="button">Export CSV</button>
              <button class="ghost" id="refreshAssets" type="button">Refresh</button>
            </div>
          </div>
          <p class="message" id="assetsMessage" role="status"></p>
          <div id="assetList" class="asset-list compact"></div>
        </section>

        <section class="panel asset-detail" aria-label="Asset preview">
          <div class="panel-head">
            <h2>Preview</h2>
          </div>
          <div id="assetDetail" class="asset-detail-body empty">Select an asset.</div>
        </section>
      </section>

      <section class="edit-workspace tab-panel" id="tab-edit" aria-label="Edit timeline">
        <aside class="panel">
          <div class="panel-head">
            <h2>Asset Bin</h2>
          </div>
          <div id="editAssetBin" class="asset-bin empty">Assets will be available here.</div>
        </aside>

        <section class="panel timeline-panel">
          <div class="panel-head">
            <h2>Timeline</h2>
            <button class="primary" type="button" disabled>Export Stereo</button>
          </div>
          <div class="timeline">
            <div class="ruler">
              <span>00:00</span>
              <span>00:05</span>
              <span>00:10</span>
              <span>00:15</span>
            </div>
            <div class="track">
              <span class="track-label">Voice</span>
              <div class="track-lane">
                <div class="clip placeholder">Add assets from Asset Bin</div>
              </div>
            </div>
            <div class="track">
              <span class="track-label">Music</span>
              <div class="track-lane muted-lane"></div>
            </div>
          </div>
        </section>
      </section>
    </main>

    <script src="/dev/app.js" type="module"></script>
  </body>
</html>
