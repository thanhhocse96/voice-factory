[package]
name = "voicefactory-desktop"
version = "0.0.1"
description = "VoiceFactory desktop shell"
authors = ["VoiceFactory"]
edition = "2021"

[lib]
name = "voicefactory_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
ureq = "2"

[features]
default = []
